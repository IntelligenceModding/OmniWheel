import net.minecraftforge.srgutils.IMappingFile

buildscript {
    repositories { maven { url = 'https://maven.minecraftforge.net/' } }
    dependencies { classpath 'net.minecraftforge:srgutils:0.6.2' }
}

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '7.0.40'
    id 'net.minecraftforge.renamer' version '1.1.2'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${mod_version}-forge-mc${minecraft_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.output.resourcesDir = file("$buildDir/classes/java/main")

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    runs {
        configureEach {
            args '--mixin.config=omniwheel.mixins.json'
            // Development classes use Mojang names; the release JAR uses its SRG refmap.
            systemProperty 'mixin.env.disableRefMap', 'true'
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'info'
            workingDir.convention project.layout.projectDirectory.dir("run/${name}")

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        register('client') {
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
}

tasks.named('jar', Jar) {
    archiveClassifier = 'dev'
    manifest.attributes('MixinConfigs': 'omniwheel.mixins.json')
}

// Forge 1.21.1 uses SRG names in installed clients. Build a mapped release JAR.
renamer.mappings.from minecraft.dependency.toSrgFile
def releaseJar = renamer.classes(tasks.named('jar', Jar))
releaseJar.configure {
    archiveClassifier = ''
    output = layout.buildDirectory.file("libs/${mod_id}-${project.version}.jar")
}
tasks.named('assemble') { dependsOn releaseJar }

def mixinMappings = layout.buildDirectory.file('mixin/mapped-to-srg.srg')
def prepareMixinMappings = tasks.register('prepareMixinMappings') {
    inputs.files(minecraft.dependency.toSrgFile)
    outputs.file(mixinMappings)
    doLast {
        def target = mixinMappings.get().asFile
        target.parentFile.mkdirs()
        new java.util.zip.GZIPInputStream(minecraft.dependency.toSrgFile.get().newInputStream()).withCloseable { input ->
            target.withOutputStream { output -> input.transferTo(output) }
        }
        IMappingFile.load(target).write(target.toPath(), IMappingFile.Format.SRG, false)
    }
}
tasks.named('compileJava', JavaCompile) {
    dependsOn prepareMixinMappings
    options.compilerArgs += [
            "-AreobfSrgFile=${mixinMappings.get().asFile}",
            "-AoutRefMapFile=${layout.buildDirectory.file('classes/java/main/omniwheel.refmap.json').get().asFile}",
            '-AdefaultObfuscationEnv=searge'
    ]
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact releaseJar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
