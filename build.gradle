plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${mod_version}-forge-mc${minecraft_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    runs {
        client {
            workingDirectory project.file('run/client')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

tasks.matching { it.name == 'genIntellijRuns' }.configureEach {
    doLast {
        def java8 = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(8)
        }.get().metadata.installationPath.asFile.absolutePath
        def runFile = file('.idea/runConfigurations/runClient.xml')
        if (runFile.exists()) {
            def xml = new XmlParser().parse(runFile)
            def configuration = xml.configuration[0]
            configuration.appendNode('option', [name: 'ALTERNATIVE_JRE_PATH', value: java8])
            configuration.appendNode('option', [name: 'ALTERNATIVE_JRE_PATH_ENABLED', value: 'true'])
            runFile.setText(groovy.xml.XmlUtil.serialize(xml), 'UTF-8')
        }
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    testImplementation 'junit:junit:4.13.2'
}

tasks.named('test', Test).configure {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(org.gradle.api.publish.maven.tasks.AbstractPublishToMaven).configureEach {
    dependsOn 'reobfJar'
}

tasks.named('jar', Jar).configure {
    finalizedBy 'reobfJar'
}

tasks.register('verifyPortJar') {
    dependsOn 'reobfJar'
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    doLast {
        def archive = tasks.named('jar').get().archiveFile.get().asFile
        new java.util.zip.ZipFile(archive).withCloseable { jar ->
            def classes = 0
            jar.entries().each { entry ->
                if (entry.name.endsWith('.class')) {
                    jar.getInputStream(entry).withCloseable { stream ->
                        def data = new DataInputStream(stream)
                        if (data.readInt() != (int) 0xCAFEBABE) {
                            throw new GradleException("Invalid class in jar: ${entry.name}")
                        }
                        data.readUnsignedShort()
                        if (data.readUnsignedShort() != 52) {
                            throw new GradleException("Class is not Java 8 bytecode: ${entry.name}")
                        }
                        classes++
                    }
                }
            }
            if (classes == 0 || jar.getEntry('de/artemis/omniwheel/OmniWheelClient.class') == null) {
                throw new GradleException('Mod classes or entry point missing from jar')
            }
            def metadata = jar.getInputStream(jar.getEntry('META-INF/mods.toml')).getText('UTF-8')
            if (metadata.contains('${') || !metadata.contains('versionRange="[1.16.5]"')) {
                throw new GradleException('Mod metadata was not expanded for Minecraft 1.16.5')
            }
            def pack = new groovy.json.JsonSlurper().parse(jar.getInputStream(jar.getEntry('pack.mcmeta')))
            if (pack.pack.pack_format != 6) {
                throw new GradleException('Wrong resource pack format for Minecraft 1.16.5')
            }
            logger.lifecycle("Verified ${classes} Java 8 classes and Forge 1.16.5 resources in ${archive.name}")
        }
    }
}

tasks.named('check').configure {
    dependsOn 'verifyPortJar'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
