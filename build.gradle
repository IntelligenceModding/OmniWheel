import net.minecraftforge.srgutils.IMappingFile

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${mod_version}-forge-mc${minecraft_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.19.2 and Forge 43 use Java 17 in both Gradle and the IDE.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets.main.output.resourcesDir = file("$buildDir/classes/java/main")

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    runs {
        client {
            workingDirectory project.file('run/client')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            args '--mixin.config=omniwheel.mixins.json'
            property 'mixin.env.disableRefMap', 'true'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    testImplementation 'junit:junit:4.13.2'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

def mixinMappings = layout.buildDirectory.file('mixin/mapped-to-srg.srg')
def prepareMixinMappings = tasks.register('prepareMixinMappings') {
    dependsOn 'createMcpToSrg'
    inputs.file(layout.buildDirectory.file('createMcpToSrg/output.tsrg'))
    outputs.file(mixinMappings)
    doLast {
        def output = mixinMappings.get().asFile
        output.parentFile.mkdirs()
        IMappingFile.load(layout.buildDirectory.file('createMcpToSrg/output.tsrg').get().asFile)
                .write(output.toPath(), IMappingFile.Format.SRG, false)
    }
}

tasks.named('compileJava', JavaCompile) {
    options.compilerArgs += [
            "-AreobfSrgFile=${mixinMappings.get().asFile}",
            "-AoutRefMapFile=${layout.buildDirectory.file('classes/java/main/omniwheel.refmap.json').get().asFile}",
            '-AdefaultObfuscationEnv=searge'
    ]
    dependsOn prepareMixinMappings
}

tasks.named('jar', Jar) {
    manifest.attributes('MixinConfigs': 'omniwheel.mixins.json')
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
