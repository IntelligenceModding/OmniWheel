# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
neogradle.subsystems.decompiler.maxMemory=6g
neogradle.subsystems.decompiler.maxThreads=2

# Minecraft
minecraft_version=26.1
minecraft_version_range=[26.1]

# NeoForge
neo_version=26.1.0.19-beta
loader_version_range=[1,)

# Mod properties
mod_id=omniwheel
mod_name=OmniWheel
mod_license=MIT License
mod_version=1.0r
mod_group_id=de.artemis.omniwheel
mod_authors=DoomedArtemis
mod_description=Client-side radial quick-action menu with configurable wheels, profiles, shortcuts, and multiplayer-safe command and keybind access.
